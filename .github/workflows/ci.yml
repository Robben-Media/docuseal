---
name: CI

on:
  push:
    branches: [main, master, feature/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILS_ENV: test
  NODE_ENV: test
  RUBY_VERSION: "4.0.1"
  NODE_VERSION: "20.19.0"

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Run RuboCop
        run: bundle exec rubocop --parallel --format github

      - name: Run ERB Lint
        run: bundle exec erb_lint ./app

      - name: Run ESLint
        run: yarn eslint "app/javascript/**/*.js"

  security:
    name: Security
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Run Brakeman
        run: bundle exec brakeman -q --exit-on-warn --format sarif --output brakeman.sarif

      - name: Upload Brakeman SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: brakeman.sarif
          category: brakeman

      - name: Bundle Audit
        run: |
          gem install bundler-audit
          bundle audit check --update

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docuseal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev
          wget -q -O pdfium-linux.tgz "https://github.com/docusealco/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz"
          sudo tar -xzf pdfium-linux.tgz --strip-components=1 -C /usr/lib lib/libpdfium.so
          rm -f pdfium-linux.tgz

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Setup database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/docuseal_test
          REDIS_URL: redis://localhost:6379/1
        run: |
          bundle exec rake db:create db:migrate

      - name: Precompile assets
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/docuseal_test
          SECRET_KEY_BASE: test-secret-key-base-for-ci
        run: bundle exec rake assets:precompile

      - name: Run RSpec (Unit & Request specs)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/docuseal_test
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY_BASE: test-secret-key-base-for-ci
          COVERAGE: true
        run: |
          bundle exec rspec --exclude-pattern "spec/system/**/*_spec.rb" --format progress

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  test-system:
    name: System Tests
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 30
    needs: [lint]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docuseal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev
          wget -q -O pdfium-linux.tgz "https://github.com/docusealco/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz"
          sudo tar -xzf pdfium-linux.tgz --strip-components=1 -C /usr/lib lib/libpdfium.so
          rm -f pdfium-linux.tgz

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Setup database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/docuseal_test
        run: |
          bundle exec rake db:create db:migrate

      - name: Precompile assets
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/docuseal_test
          SECRET_KEY_BASE: test-secret-key-base-for-ci
        run: bundle exec rake assets:precompile

      - name: Run System Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/docuseal_test
          SECRET_KEY_BASE: test-secret-key-base-for-ci
        run: |
          bundle exec rspec spec/system --format progress

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: system-test-screenshots
          path: tmp/capybara/
          retention-days: 7

  all-tests-pass:
    name: All Tests Pass
    runs-on: blacksmith-2vcpu-ubuntu-2204
    needs: [lint, security, test, test-system]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.test-system.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed!"
